server {
    listen 80;
    server_name cream-fm.art api.cream-fm.art;

    # For certbot challenges
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name cream-fm.art;

    # SSL certificates managed by certbot
    ssl_certificate /etc/letsencrypt/live/cream-fm.art/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cream-fm.art/privkey.pem;

    # Front-end site
    location / {
        root /var/www/html;
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl;
    server_name api.cream-fm.art;

    # SSL certificates managed by certbot
    ssl_certificate /etc/letsencrypt/live/cream-fm.art/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cream-fm.art/privkey.pem;

    # API proxy
    location / {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}